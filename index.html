<body>
<header><h1>💳 刷哪张卡<small id="qlabel"></small></h1><button class="gear" id="gear" aria-label="设置">⚙️</button></header>
<main>

  <div class="foot">数据核查于 2026-11-13 · 以发卡行条款为准<br>季度类别未公布时仅按基础倍率计算</div>
</main>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<script>
/* ===== 季度数据（新增季度：往 QUARTERS 里加一项；某卡类别未公布就写 null） =====
 * chase:    cats=季度类别, add=在原倍率上加的百分点（Flex 餐饮 3+4=7）, cap=合并上限
 * discover: cats=季度类别, rate=总倍率, retro=是否可追溯
 * extra:    不在 11 个格子里的类别（只做展示）
 */
const QUARTERS = [
  { id:"2026Q4", label:"2026 Q4", start:"2026-10-01", end:"2026-12-31",
    chase:{ cats:["groceries","dining"], extra:"美国红十字会捐款", add:4, cap:1500,
            activate:"9/15–12/14 激活，可追溯至 10/1", note:"Flex 餐饮 7%（3%+4%），原版 Freedom 餐饮 5%；超市不含 Walmart/Target/仓储店" },
    discover:{ cats:["dining","entertainment","utilities"], rate:5, cap:1500, retro:false,
            activate:"可激活至 12/31，不追溯（激活后才算）" },
    tips:{ dining:"三张季度卡额度各 $1,500：Flex(7%) → 原版 Freedom(5%) → Discover(5%) 依次刷满。" } },
  { id:"2027Q1", label:"2027 Q1", start:"2027-01-01", end:"2027-03-31",
    chase:{ cats:["groceries","streaming"], add:4, cap:1500,
            activate:"12/15/2026 起可激活（Chase 官网未写明截止日；过往多为季度中旬前）",
            note:"超市不含 Walmart/Target；流媒体仅限 Chase 指定商户（Netflix、Disney+、Hulu、Max、Apple Music/TV、Spotify、YouTube Premium/TV、Paramount+、Peacock、ESPN、Fubo、Pandora、SiriusXM、Sling TV、Showtime、Fandango at Home 等）" },
    discover:null,   // 截至 2026-11-09：NerdWallet/earnrate/DoC 均未公布 Discover Q1 2027
    tips:{} },
  { id:"2027Q2", label:"2027 Q2", start:"2027-04-01", end:"2027-06-30",
    chase:null,   // Chase 官网仅写 Coming Soon，3/15/2027 起可激活；类别未公布
    discover:null,
    tips:{},
    note:"Chase 官网显示 APR–JUN 2027 为 Coming Soon，激活起始日 3/15/2027；类别尚未公布。" }
];
const PRESETS = { tpg:{n:"TPG估值",UR:2.05,C1:1.85,HH:0.4}, mid:{n:"折中",UR:1.5,C1:1.5,HH:0.5}, cash:{n:"现金",UR:1,C1:1,HH:0.4} };
const CATS = [
  {k:"dining",e:"🍽️",n:"餐饮",g:"日常",kw:"餐厅 吃饭 外卖 快餐 restaurant doordash ubereats starbucks"},
  {k:"groceries",e:"🛒",n:"超市",g:"日常",kw:"超市 杂货 grocery supermarket whole foods kroger safeway trader joe"},
  {k:"gas",e:"⛽",n:"加油",g:"日常",kw:"加油 油站 gas shell chevron ev 充电"},
  {k:"drugstore",e:"💊",n:"药店",g:"日常",kw:"药店 cvs walgreens 药房 drugstore pharmacy rite aid"},
  {k:"utilities",e:"💡",n:"水电话费",g:"日常",kw:"水电 电费 网费 话费 utilities internet phone verizon comcast"},
  {k:"online",e:"📦",n:"网购平台",g:"购物",kw:"网购 网上 线上 online amazon 亚马逊 shein temu aliexpress 速卖通 ebay walmart.com target.com walmart target costco.com costco 沃尔玛 塔吉特 好市多 paypal"},
  {k:"apparel",e:"👕",n:"服饰/鞋包",g:"购物",kw:"服饰 衣服 鞋 包 fashion apparel uniqlo 优衣库 zara h&m hm gap old navy lululemon nike adidas abercrombie revolve ssense farfetch banana republic athleta nordstrom rack 除外见百货"},
  {k:"dept",e:"🏬",n:"百货商场",g:"购物",kw:"百货 商场 department macy macys 梅西 nordstrom 诺德斯特龙 nordstrom rack kohl kohls tj maxx tjmaxx marshalls 马歇尔 bloomingdales 布鲁明戴尔 dillards jcpenney saks"},
  {k:"beauty",e:"💄",n:"美妆护肤",g:"购物",kw:"美妆 护肤 化妆品 beauty skincare sephora 丝芙兰 ulta 雅诗兰黛 estee lauder esteelauder clinique 倩碧 lancome 兰蔻 la mer origins bluemercury 品牌官网"},
  {k:"flights",e:"✈️",n:"旅游/机票",g:"出行",kw:"机票 航空 飞机 flight airline united delta american 旅行"},
  {k:"hotels",e:"🏨",n:"酒店",g:"出行",kw:"酒店 marriott hyatt ihg hilton 万豪 凯悦 希尔顿 hotel"},
  {k:"streaming",e:"📺",n:"流媒体",g:"出行",kw:"流媒体 netflix disney spotify hulu youtube 视频 音乐 订阅"},
  {k:"entertainment",e:"🎬",n:"娱乐",g:"出行",kw:"电影 演唱会 演出 体育 门票 entertainment movie concert ticketmaster"},
  {k:"other",e:"🧾",n:"其他",g:"其他",kw:"其他 日常 一般 other everything"}
];
const STACK = "下单前可叠加（比例不固定、先查再买）：Chase Offers / Amex Offers / Capital One Offers（先激活再用对应卡）；购物门户只选一个——Shop through Chase（Freedom/CSR 可再叠加卡积分）、Capital One Shopping 或 Rakuten（兑现或转 Amex MR）。两个门户不能叠。";
const TIPS = {
  dining:"Hilton 5x 仅限美国餐厅。",
  groceries:"Chase 超市不含 Walmart/Target/Costco 等仓储店。在这些店买菜按「网购平台/其他」的基础倍率，没有季度 5%。",
  gas:"实体店若能用 Samsung Wallet，可在设置中打开 → Samsung 卡 3%。",
  flights:"通过 Chase Travel 订用 CSR 8x 更高；邮轮/民宿/交通 CSR 只有 1x，用 Venture 2x。",
  hotels:"Chase Travel 订用 CSR 8x；Capital One Travel 订用 Venture 5x；希尔顿官网 Hilton 卡 7x（每点约 0.4¢）。",
  online:"Q4 2026 与 Q1 2027 均无 Amazon/PayPal/网购平台季度加成（Flex 上次 Amazon 5% 是 2026 Q2）。Walmart/Target 买菜也不算 Chase 超市。Costco.com 通常只收 Visa（CSR/Venture/Samsung；Flex 是 Mastercard、Hilton 是 Amex、Discover 可能无法用）。线上走 PayPal 常记成支付平台，不会变成商店类别。"+STACK,
  apparel:"服装专卖店（Nike、Zara、Uniqlo 等）不属于 Chase「百货」类别；本季与下季也没有服饰加成，按基础倍率。"+STACK,
  dept:"Q4 2026 / Q1 2027 均无「百货」季度类别（Chase 上次百货是 2025 Q4）。官网购物一般按百货编码；TJ Maxx/Marshalls 多为折扣店，不一定算百货。丝芙兰等美妆专卖不算百货。"+STACK,
  beauty:"丝芙兰、Ulta、品牌官网（雅诗兰黛/倩碧等）通常编码为化妆品店，不是药店，Freedom Flex 的 3% 药店一般不适用（以账单编码为准）。本季与下季无美妆加成。"+STACK,
  streaming:"",
  utilities:"先确认是否收刷卡手续费。",
  entertainment:"Capital One Entertainment 平台购票 Venture 5x。",
  drugstore:"药店 3% 一般指 CVS/Walgreens 等；Ulta/Sephora 通常不算。",
  other:"实体店能用 Samsung Wallet 时 Samsung 卡 3%。"
};
/* 卡片：r = 各类别总倍率；cur = 积分类型 */
const CARDS = [
  {id:"flex", n:"Freedom Flex", cur:"UR", base:1, q:"chase", r:{dining:3,drugstore:3}},
  {id:"csr", n:"Sapphire Reserve", cur:"UR", base:1, r:{dining:3,flights:4,hotels:4}},
  {id:"freedom", n:"Freedom（原版）", cur:"UR", base:1, q:"chase", r:{},
   fu:{n:"Freedom Unlimited", base:1.5, r:{dining:3,drugstore:3}}},
  {id:"hilton", n:"Hilton Amex", cur:"HH", base:3, r:{dining:5,groceries:5,gas:5}},
  {id:"venture", n:"Venture", cur:"C1", base:2, r:{}},
  {id:"discover", n:"Discover it", cur:"CASH", base:1, q:"discover", r:{}},
  {id:"samsung", n:"Samsung Galaxy", cur:"CASH", base:1, r:{streaming:2}, wallet:3}
];
/* ===== 逻辑 ===== */
const KEY="cardRewards.mobile.v1";
const DEF={q:null,act:{},cat:"dining",preset:"tpg",pool:true,legacy:"freedom",wallet:false,owned:CARDS.map(c=>c.id)};
let S; try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){S={...DEF}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const f=n=>(Math.round(n*10)/10).toString();
const today=new Date().toISOString().slice(0,10);
const curQ = QUARTERS.find(q=>today>=q.start&&today<=q.end);
const urlQ = new URLSearchParams(location.search).get("q");   // 例：?q=2027Q1
if (urlQ && QUARTERS.some(q=>q.id===urlQ)) S.q = urlQ;
const urlC = new URLSearchParams(location.search).get("cat");
if (urlC && CATS.some(c=>c.k===urlC)) S.cat = urlC;
let Q = QUARTERS.find(q=>q.id===S.q) || curQ || QUARTERS[QUARTERS.length-1];
const qStatus = q => q===curQ ? "当前" : (today<q.start ? "未来" : "已过");
const isAct = issuer => { const a=(S.act[Q.id]||{})[issuer]; return a===undefined ? true : a; };
function setQ(id){ Q=QUARTERS.find(q=>q.id===id)||Q; S.q=Q.id; save(); render(); }

function evalCard(c0,cat){
  let c=c0; if(c0.id==="freedom"&&S.legacy==="fu") c={...c0,n:c0.fu.n,base:c0.fu.base,r:c0.fu.r,q:null};
  let x = c.r[cat]!=null ? c.r[cat] : c.base, note="";
  if(c.id==="hilton"&&["dining","groceries","gas"].includes(cat)) note="仅限美国境内";
  const q=c.q&&Q[c.q];
  if(q&&q.cats.includes(cat)){
    const act=isAct(c.q), qx=q.rate||x+q.add;
    if(act){x=qx; note=`${Q.label} 季度类别 · 前 $${q.cap}`;} else note=`⚠️ 未激活（激活后 ${qx}%）`;
  }
  if(c.wallet&&S.wallet&&x<c.wallet){x=c.wallet; note=(["online","apparel","dept","beauty"].includes(cat)?"用 Samsung Wallet（线上是否算 3% 未核实）":"用 Samsung Wallet 支付");}
  const P=PRESETS[S.preset]; let cents = c.cur==="CASH"?1 : P[c.cur];
  if(c.cur==="UR"&&c.id!=="csr"&&!S.pool) cents=1;
  const unit = (c.cur==="CASH"||(c.cur==="UR"&&c.id!=="csr"))?"%":"x";
  return {n:c.n,x,unit,cents,pct:x*cents,note};
}
function renderQ(){
  $("qsel").innerHTML=QUARTERS.map(q=>`<option value="${q.id}" ${q===Q?"selected":""}>${q.label}（${qStatus(q)}${q.chase||q.discover?"":" · 未公布"}）</option>`).join("");
  $("qlabel").textContent = Q.label+" · "+Q.start.slice(5).replace("-","/")+"–"+Q.end.slice(5).replace("-","/")+(curQ?"":" · ⚠️ 请更新季度数据");
  const nm=k=>(CATS.find(c=>c.k===k)||{n:k}).n;
  const line=(name,d)=> d
    ? `<div><b>${name}</b>：${d.cats.map(nm).join("、")}${d.extra?"、"+d.extra:""} ${d.rate||5}%（上限 $${d.cap}）<br><span style="color:#6b7280;font-size:12px">${d.activate}${d.note?" · "+d.note:""}</span></div>`
    : `<div class="na"><b>${name}</b>：该季度类别尚未公布，暂按基础倍率计算</div>`;
  $("qinfo").innerHTML = (!Q.chase&&!Q.discover)
    ? `<div class="na">📅 <b>${Q.label}</b> 该季度类别尚未公布。下方按各卡基础/常规倍率排序；公布后刷新页面即可获取更新。${Q.note?`<br>${Q.note}`:""}</div>`
    : line("Chase Freedom/Flex",Q.chase)+line("Discover it",Q.discover)
      +(qStatus(Q)==="未来"?`<div style="font-size:12px;color:#6b7280;margin-top:4px">未来季度默认按“已激活”计算，可在 ⚙️ 中调整。</div>`:"");
}
function catText(c){return (c.n+" "+c.kw).toLowerCase();}
function matches(c,q){return !q || catText(c).includes(q);}
function renderTiles(q){
  q=(q||"").trim().toLowerCase();
  const vis=CATS.filter(c=>matches(c,q));
  const hit=q?vis:[];
  let html="",g="";
  (q?vis:CATS).forEach(c=>{
    if(!q && c.g!==g){g=c.g;html+=`<div class="grp">${c.g}</div>`;}
    html+=`<button class="tile ${c.k===S.cat?"on":""}" data-k="${c.k}"><span>${c.e}</span>${c.n}</button>`;
  });
  $("tiles").innerHTML=html || '<div class="grp">没有匹配的类别，试试「其他」</div>';
  if(q && hit.length){
    $("hits").textContent = hit.length===1 ? `已定位：${hit[0].n}` : `找到 ${hit.length} 个类别`;
    if(hit.length===1 && S.cat!==hit[0].k){S.cat=hit[0].k;save();}
  } else $("hits").textContent = q ? "无匹配" : "";
}
function render(){
  renderQ();
  renderTiles($("qfind")?$("qfind").value:"");
  const rows=CARDS.filter(c=>S.owned.includes(c.id)).map(c=>evalCard(c,S.cat)).sort((a,b)=>b.pct-a.pct);
  const cat=CATS.find(c=>c.k===S.cat);
  if(!rows.length){$("rec").innerHTML='<div class="name">请在 ⚙️ 中选择你的卡</div>';$("list").innerHTML="";return;}
  const t=rows[0];
  $("rec").innerHTML=`<div class="lab">${cat.e} ${cat.n} · 推荐：</div><div class="name">${t.n}</div>
    <div class="rate">${f(t.x)}${t.unit}${t.unit==="x"||t.cents!==1?` × ${t.cents}¢`:""} ≈ <b>${f(t.pct)}%</b> 回报${t.note?` · ${t.note}`:""}</div>
    ${[Q.tips&&Q.tips[S.cat],TIPS[S.cat]].filter(Boolean).map(x=>`<div class="tip">💡 ${x}</div>`).join("")}`;
  $("list").innerHTML=rows.map((r,i)=>`<div class="item"><div class="n">${i+1}</div><div class="mid"><b>${r.n}</b><i class="${r.note.startsWith("⚠️")?"warn":""}">${f(r.x)}${r.unit}${r.note?" · "+r.note:""}</i></div><div class="pct">${f(r.pct)}%<small>${r.cents}¢/点</small></div></div>`).join("");
}
function settings(){
  const seg=(key,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button data-set="${key}" data-v="${v}" class="${S[key]===v?"on":""}">${l}</button>`).join("")}</div>`;
  const tog=(key,l)=>`<label class="tog">${l}<input type="checkbox" data-tog="${key}" ${S[key]?"checked":""}></label>`;
  $("panel").innerHTML=`<h2>设置</h2>
    <h3>积分估值（UR / Capital One / Hilton）</h3>${seg("preset",Object.entries(PRESETS).map(([k,p])=>[k,`${p.n}<br><small>${p.UR}/${p.C1}/${p.HH}¢</small>`]))}
    <h3>原版 Chase Freedom 状态</h3>${seg("legacy",[["freedom","仍是原版（季度5%）"],["fu","已转 Unlimited"]])}
    <h3>开关</h3>${Q.chase?`<label class="tog">已激活 Chase ${Q.label} 类别<input type="checkbox" data-act="chase" ${isAct("chase")?"checked":""}></label>`:""}${Q.discover?`<label class="tog">已激活 Discover ${Q.label} 类别<input type="checkbox" data-act="discover" ${isAct("discover")?"checked":""}></label>`:""}${tog("wallet","能用 Samsung Wallet 支付")}${tog("pool","Freedom 积分并入 CSR（按 UR 估值）")}
    <h3>我持有的卡</h3>${CARDS.map(c=>`<label class="tog">${c.n}<input type="checkbox" data-own="${c.id}" ${S.owned.includes(c.id)?"checked":""}></label>`).join("")}
    <button class="close" id="closeBtn">完成</button>`;
}
$("tiles").addEventListener("click",e=>{const b=e.target.closest(".tile");if(b){S.cat=b.dataset.k;save();render();$("rec").scrollIntoView({behavior:"smooth",block:"start"});}});
$("qfind").addEventListener("input",()=>{render();});
$("qfind").addEventListener("search",()=>{render();});
$("qsel").addEventListener("change",e=>setQ(e.target.value));
$("gear").onclick=()=>{settings();$("sheet").classList.add("on");};
$("sheet").addEventListener("click",e=>{
  if(e.target.id==="sheet"||e.target.id==="closeBtn"){$("sheet").classList.remove("on");return;}
  const b=e.target.closest("[data-set]"); if(b){S[b.dataset.set]=b.dataset.v;save();settings();render();}
});
$("sheet").addEventListener("change",e=>{const t=e.target;
  if(t.dataset.tog){S[t.dataset.tog]=t.checked;}
  if(t.dataset.act){S.act[Q.id]=Object.assign({},S.act[Q.id],{[t.dataset.act]:t.checked});}
  if(t.dataset.own){S.owned=t.checked?[...new Set([...S.owned,t.dataset.own])]:S.owned.filter(x=>x!==t.dataset.own);}
  save();render();});
